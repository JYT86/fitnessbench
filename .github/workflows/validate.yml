name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # test_validate.py runs validate.py over the committed datasets first,
      # then confirms each check still fires on deliberately corrupted copies
      - run: python test_validate.py
      - run: python validate.py --strict
